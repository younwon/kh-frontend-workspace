<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록태그</title>
</head>
<body>
    <h3>ul(unorderedList) : 순서가 없는 목록</h3>

    <ul>
        <li>
            HTML
            <ol>
                <li>글자목록</li>
                <li>표태그</li>
            </ol>
        </li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
    </ul>

    실무에서는 ul/li 목록을 만든다기 보다는 <br>
    메뉴바(네비게이션) 만들 때 사용을 많이함
</body>
</html>
