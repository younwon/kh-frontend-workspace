<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영역관련태그</title>
    <style>
        body{
            padding-bottom: 600px;
        }
        div,
        span{
            width: 400px;
            height: 400px;
            border: 1px solid rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <h1>영역이란뭘까</h1>

    <pre>
        HTML의 목적 : 문서의 구조를 정의하고 + 값에 의미를 부여하는 것
    </pre>

    <!--
        1. 블럭(block) 요소
        한 줄을 통째로 차지함
        (h1~h6, p, pre, ul, ol, li, table, 'div')
        2. 인라인(inline) 요소
        content길이만큼만 공간을 차지함
        다음줄로 개행하고싶으면 br요소를 써야함
        (b, strong, i, em, mark, s, img, 'span')
    -->

    <h4>div : 블록요소를 살펴보자</h4>
    <div>1번 영역</div>
    <div>2번 영역</div>
    <div>3번 영역</div>

    <h4>span : 인라인요소를 살펴보자</h4>
    <span>1번 영역</span><span>2번 영역</span><span>3번 영역</span>

    <h4>현재 문서에 다른 페이즈를 끼워넣는 태그</h4>
    <iframe src="03__이미지태그.html" frameborder="0"
    width="100%"
    height="500"></iframe>

    <iframe width="769" height="441" src="https://www.youtube.com/embed/ceunS5X0pQc" title="Grand Theft Auto VI: 지금 사전 다운로드" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="797" height="456" src="https://www.youtube.com/embed/hnFhj7S8qmA" title="실시간으로 문닫고 있다는 9,800원 한우집의 근황" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>
</html>
