<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script type="text/javascript" 
            src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0b6e1ccff5070e6fec38b68a4902b456"></script>
    <title>가맹점 창업 비용</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        body{
            padding-bottom: 600px;
        }
    </style>
</head>
<body>
    <!-- 기준년도, 브랜드명, 업종중분류명, 합계금액 -->

    <h2>브랜드별 창업 금액 현황</h2>

    기준년도를 입력하세요 :  <input type="text" id="year">
    <hr>

    <div id="brand-result">
        <table class="table table-success table-striped-columns">
            <thead>
                <tr>
                    <th>기준년도</th>
                    <th>브랜드명</th>
                    <th>업종명</th>
                    <th>창업금액</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    <hr>
    <button onclick="next()" class="btn btn-outline-primary btn-lg">다음</button>

    <script>
        let page = 1;
        function next(){
            brand(page);
            page++;
        };

        function brand(num){
            let year = document.querySelector("#year").value;
            if(year === "" || year < 2017 || 2025 < year) year = 2025;


            $.ajax({
                url : `https://apis.data.go.kr/1130000/FftcBrandFntnStatsService/getBrandFntnStats?serviceKey=4f8f2fc1680492ab1b09d5b50ce274fb42c0b045b7cf3908cffce58b2239b688&pageNo=${num}&numOfRows=20&resultType=json&yr=${year}`,
                dataType : 'json',
                success : result => {
                    //console.log(result);
                    const items = result.items;
                    //console.log(items);
                    const el = items.map(e => `<tr>
                                                <td>${e.yr}</td>
                                                <td>${e.brandNm}</td>
                                                <td>${e.indutyMlsfcNm}</td>
                                                <td>${e.smtnAmt}</td>                                                
                                               </tr>`).join('');
                    
                    document.querySelector("tbody").innerHTML = el;
                },

            });
        }
    </script>

    <hr>

    <h1 style="margin-top: 1000px;">무창포 박물관</h1>

    <div style="padding: 100px;" id="museum"></div>
    <hr>
    <button onclick="letsGo()">무창포 레쓰고</button>

    <script>
        let pageNo = 1;
        function letsGo(){
            $.ajax({
                url : `https://apis.data.go.kr/4510000/GetMuchangpoBeachPhotoService/getMuchangpoBeachInfo?serviceKey=4f8f2fc1680492ab1b09d5b50ce274fb42c0b045b7cf3908cffce58b2239b688&pageIndex=1&firstIndex=${pageNo++}&dataType=json`,
                dataType : "json",
                success : (result) => {
                    console.log(result);
                    const item = result.response.body.items.item[0];
                    console.log(item);

                    const imgs = item.IMG_LIST.map(i => `
                                                        <img src="${i.imgUrl}"
                                                        style="height:100%; width:200px; object-fit:cover"/>
                                                        `).join('');

                    const el = `<div style='margin-bottom: 10px; padding: 8px'>
                                    <h4>${item.TTL}</h4>
                                    <p>등록일 : ${item.REG_YMD}</p>
                                    <div style="display:flex; gap:6px; height: 160px; overflow-x:auto;">
                                        ${imgs}
                                    </div>
                                </div>`;

                    document.querySelector("#museum").innerHTML = el;
                }
            });
        }
    </script>

    <hr>


    <h2>지도를 띄운다</h2>
    <div id="map" style="width:500px;height:400px;"></div>

    <script>
        var container = document.getElementById('map'); //지도를 담을 영역의 DOM 레퍼런스
        var options = { //지도를 생성할 때 필요한 기본 옵션
                center: new kakao.maps.LatLng(33.450701, 126.570667), //지도의 중심좌표. //url에 있는 maps에 접근하는거임
                level: 3 //지도의 레벨(확대, 축소 정도)
            };

        var map = new kakao.maps.Map(container, options); //지도 생성 및 객체 리턴
    </script>

    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
