<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보더</title>
    <style>
        body{
            padding-bottom: 600px;
        }
        div{
            width: 100px;
            height: 100px;
            border-width: 3px;
            margin: 20px;
            display: inline-block;
        }
        #test1{
            border-style: dotted;
            border-width: 10px;
            border-color: salmon;
            border-top-style: double;
            border-right-color: brown;
            border-bottom-width: 1px;
        }

        #test2{
            border: 10px dashed yellowgreen;
        }

        #test3{
            border-style: dashed double solid dotted;
        }

        #test4{
            border-style: groove;
            border-width: 10px;
            border-color: rgb(68, 43, 43);
        }

        #test5{
            border-style: ridge;
            border-width: 10px;
        }

        #test6{
            border-style: inset;
            border-width: 10px;
        }

        #test7{
            border-style: outset;
            border-width: 10px;
            &:active {border-style: inset;}
            &:hover{cursor: pointer;}
        }

        #test8{
            border: 1px solid black;
        }

        #test9{
            border: solid;
            border-radius: 10px;
        }

        #test10{
            border: solid 1px rgba(0, 0, 0, 0.1);
            border-radius: 4px;

            &:hover{
                box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.093);
                cursor: pointer;
            }
        }

        #text{
            width: auto;
            height: auto;
            border: none;
            font-size: 50px;
            font-weight: 900;
            color: white;
            text-shadow: 0px 0px 4px gray,
                         0px -5px 4px yellow,
                         0px -8px 8px orange,
                         0px -16px 18px red;
        }

        #btn {
            width: 200px;
            height: 30px;
            border-radius: 8px;
            background-color: white;
            font-weight: bold;
            border-color: rgba(0, 0, 0, 0.1);

            &:hover{
                cursor: pointer;
                background-color: lightblue;
            }
        }

        ul{
            padding: 0;
            margin: 0;
            list-style: none;
        }
    </style>
</head>
<body>

    <button id="btn">버튼</button>

    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>

    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <div id="test4"></div>
    <div id="test5"></div>
    <div id="test6"></div>
    <div id="test7"></div>
    <div id="test8"></div>
    <div id="test9"></div>
    <div id="test10"></div>

    <div id="text">옛날감성</div>
</body>
</html>
