<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배경관련스타일</title>
    <style>
        body{
            padding-bottom: 600px;
        }
        #bg-color{
            background-color: aquamarine;
            width: 50%;
            height: 150px;
            border: 50px dashed black;
            box-sizing: border-box;
            padding: 30px;
            background-clip: content-box;
        }

        #bg-img{
            border: 1px solid red;
            width: 100%;
            height: 600px;
            background-image: url(https://img.magnific.com/free-photo/mesmerizing-view-lonely-tree-green-fields-blue-sky_181624-23654.jpg?semt=ais_hybrid&w=740&q=80);
            background-repeat: no-repeat;
            background-position: center;
            background-size: auto;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h3>배경관련스타일</h3>
    <div id="bg-color"></div>

    <div id="bg-img"></div>
</body>
</html>
