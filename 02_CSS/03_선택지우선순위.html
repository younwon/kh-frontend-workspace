<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택지우선순위</title>
    <style>
        body{

            #h1{
                background-color: dodgerblue;
            }
            h1{
                color: white;
                background: red;
            }
            .c1{
                color: green;
                background-color: rosybrown;
            }
            h1{
                color: yellow;
            }
            h1{
                color: aqua !important;
            }
        }
    </style>
</head>
<body>
    <h1 id="h1" class="c1" style="background-color: yellow;">선택자 우선순위</h1>

    <pre>
        선택자는
        위에서 아래로 적용
        같은 선택자라면 아래 있는게 우선순위가 높다

        !important -> 인라인 스타일 -> 아이디 선택자 
        -> 클래스 선택자 -> 태그 선택자
    </pre>
</body>
</html>
