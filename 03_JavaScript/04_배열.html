    <button onclick="syntax()">F12 콘솔창을 보세요</button>

    <script>
        function syntax(){
            console.log('a' == 'a'); //t
            console.log(1 == '1'); //t
            console.log([] == 0); //t
            // == 이거는 비권장

            console.log('1' === 1);

            const fruits = ['apple', 'banana', 'charry'];

            const [e1, e2, e3] = fruits;
            console.log(e1, e2, e3);

            const fruit = ["Durian", "Eggfruit"]
            const arr = [...fruits, ...fruit]; //새로운 배열을 만들어서 합치기
            console.log(arr);

            console.log("-------------------------------------------")
            const nums = [1,2,3,4,5];
            const nums2 = nums.map(function(e) {
                return e + 1;
            });
            console.log(nums2);
            const nums3 = nums.map((e) => {
                return e + 1;
            });
            console.log(nums3);
            const nums4 = nums.map((e) => e + 1);
            console.log(nums4);

            const filters = nums.filter((e) => e % 2 != 0).map((e) => e+1);
            console.log(filters);
        }
    </script>

    <h3>정렬</h3>

    <button onclick="sort()">정렬</button>

    <script>
        function sort(){
            const arr = ['Banana', '용과','lemon', 'apple', '망고', '수박'];
            console.log(arr);
            const b = arr.toSorted(); //원본은 그대로 두고 정렬된 새로운 배열을 반환 (Mutable하지 않음)
            console.log(b);
            arr.sort(); //원본 배열을 정렬 (Mutable함)
            console.log(arr);
            arr.reverse(); //원본 배열을 뒤집음
            console.log(arr);
        }
    </script>

    <div id="area5" class="area"></div>
    <button onclick="join()">버튼</button>

    <script>
        function join(){
            const area = document.querySelector("#area5");
            const arr = ['홍길동', '고길동', '장구', '도라에', '보노보노'];

            // area.innerHTML = arr;

            area.innerHTML = arr.map(n => `<div class="name">이름 ${n}</div>`).join("중간에 들어갈 내용");
        }
    </script>
